name: Manual Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Rama, etiqueta o SHA a desplegar
        required: true
        default: develop
        type: string
      environment:
        description: Entorno a desplegar
        required: true
        type: choice
        options: [develop, preproduction, production]

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve checkout ref
        id: resolve-ref
        uses: actions/github-script@v7
        with:
          script: |
            const rawInput = core.getInput('branch', { required: true }).trim();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (/[*?[\\\]]/.test(rawInput)) {
              core.setFailed(`The 'branch' input must be an exact branch, tag, or commit SHA: '${rawInput}'.`);
              return;
            }
            if (/^[0-9a-f]{7,40}$/i.test(rawInput)) {
              core.setOutput('ref', rawInput);
              return;
            }

            const branch = rawInput.replace(/^refs\/heads\//, '').replace(/^origin\//, '');
            try {
              const { data } = await github.rest.repos.getBranch({ owner, repo, branch });
              core.setOutput('ref', data.commit.sha);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              const { data } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${rawInput.replace(/^refs\/tags\//, '')}`,
              });
              core.setOutput('ref', data.object.sha);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Could not resolve '${rawInput}' in ${owner}/${repo}.`);
                return;
              }
              throw error;
            }

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Resolve Wrangler config
        shell: bash
        run: |
          case "${{ inputs.environment }}" in
            develop) echo "WRANGLER_CONFIG=wrangler.dev.jsonc" >> "$GITHUB_ENV" ;;
            preproduction) echo "WRANGLER_CONFIG=wrangler.pre.jsonc" >> "$GITHUB_ENV" ;;
            production) echo "WRANGLER_CONFIG=wrangler.pro.jsonc" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported environment: ${{ inputs.environment }}"; exit 1 ;;
          esac

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config "${{ env.WRANGLER_CONFIG }}"
