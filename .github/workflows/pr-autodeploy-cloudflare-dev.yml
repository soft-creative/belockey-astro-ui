name: PR Autodeploy Dev Cloudflare

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

concurrency:
  group: pr-autodeploy-cloudflare-dev-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Build and deploy PR to dev in Cloudflare
    runs-on: ubuntu-latest
    environment: develop
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'autodeploy') &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config wrangler.dev.jsonc
